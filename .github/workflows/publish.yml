name: Publish

# Publish the 51Degrees crates to crates.io when main changes, in dependency
# order, skipping versions already published. The version comes from the tags,
# so a release is a tag and no commit decides one on its own.
#
# Authentication uses crates.io Trusted Publishing: the
# rust-lang/crates-io-auth-action exchanges this run's GitHub OIDC identity for a
# short-lived crates.io token, so no long-lived API token is stored in the
# repository. Each published crate must have this repository and workflow
# registered as a trusted publisher on crates.io (one-time setup, see
# ci/setup-trusted-publishing.sh and https://crates.io/docs/trusted-publishing).

on:
  push:
    branches: [main]
  # The only route that can allow a major or minor bump, so that releasing one
  # is a person dispatching this workflow with their name on the run rather
  # than something a commit message does quietly.
  workflow_dispatch:
    inputs:
      allow-version-bump:
        description: 'Publish even though the version moves the major or minor place.'
        type: boolean
        default: false

# Never let two publish runs race; a second push waits for the first to finish.
concurrency:
  group: publish-crates-io
  cancel-in-progress: false

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      # write, because a successful publish writes the tag the next release
      # counts from, as the publish does in the other languages.
      contents: write
      # Required to mint the OIDC token Trusted Publishing exchanges for a
      # short-lived crates.io token.
      id-token: write
    steps:
      # The owid-rust submodule holds the OWID source that ci/copy-owid-source.ps1
      # compiles into fodid. The copy is ignored by git and listed in the fodid
      # manifest's include, so cargo publish packages it with the crate.
      - uses: actions/checkout@v4
        with:
          submodules: true
          # GitVersion reads the tags to work out the next version, and a
          # shallow clone has none of them.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # The version comes from the tags, as it does in the other five
      # languages, rather than from a number committed in each manifest. No
      # commit can then release a version by accident, and all 24 crates move
      # together instead of drifting apart, which is how three of them reached
      # 4.6 while the other twenty one stayed at 4.5.2.
      - name: Work out the version from the tags
        id: version
        shell: pwsh
        run: |
          # GitVersion counts from the last version tag. Given none it does
          # not fail, it answers 0.0.1, and publishing that to crates.io
          # could never be undone. So having no tags stops the run rather
          # than being worked around quietly.
          $tags = git tag --list | Where-Object { $_ -match '^v?[0-9]+[.][0-9]+[.][0-9]+$' }
          if (-not $tags) {
            Write-Output "::error title=No version tags::There is nothing for the version to count from, so this run has stopped."
            Write-Output ""
            Write-Output "GitVersion answers 0.0.1 where a repository has no version tags. It does not fail, so without this check that number would be written into all the crate manifests and published. crates.io can never be unpublished."
            Write-Output ""
            Write-Output "The crates already published are fodid 4.5.5 and fodid-client 4.5.0, so the line to continue from is 4.5.5. Create that tag on the commit those were built from, then run this again:"
            Write-Output ""
            Write-Output "    git tag 4.5.5 <commit> && git push origin 4.5.5"
            Write-Output ""
            Write-Output "This is needed once. After a release has gone out from here the tag is written by this workflow."
            exit 1
          }
          dotnet tool install --global GitVersion.Tool --version 6.*
          $v = dotnet-gitversion /showvariable SemVer
          if (-not $v) { throw 'GitVersion produced no version' }
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT
          Write-Output "Releasing $v"
      # The same check the other five languages publish through, taken from
      # common-ci rather than copied here, so there is one rule and not two
      # that drift apart.
      - name: Checkout common-ci
        uses: actions/checkout@v4
        with:
          repository: 51Degrees/common-ci
          path: common-ci
      # Refuses a version that moves the major or minor place unless this run
      # was dispatched by someone who asked for it. A push to main carries no
      # inputs, so that route can never allow one and no commit message can
      # release a 4.6 by itself. Three crates reached 4.6 overnight on
      # 18 September 2026 by exactly that route.
      #
      # This runs before the version is written into the manifests, so a
      # refused run leaves the tree alone as well as publishing nothing.
      - name: Refuse a major or minor bump nobody approved
        shell: pwsh
        env:
          ALLOW_VERSION_BUMP: ${{ inputs.allow-version-bump }}
        run: >-
          ./common-ci/steps/check-version-bump.ps1
          -Version '${{ steps.version.outputs.version }}'
          -RepoName '.'
      - name: Write that version into every crate
        shell: pwsh
        run: ./ci/set-crate-versions.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Copy the OWID source into fodid
        shell: pwsh
        run: ./ci/copy-owid-source.ps1
      - name: Authenticate to crates.io (Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: bash ci/publish-crates.sh

      # The tag is what the next release counts from. The other languages get
      # theirs from their publish, which is why they have a release history
      # to read and this repository had none.
      - name: Tag what was published
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if (git tag --list $env:VERSION) {
            Write-Output "Tag $env:VERSION is already here, leaving it alone."
            exit 0
          }
          git tag $env:VERSION
          git push origin $env:VERSION
          Write-Output "Tagged $env:VERSION"

  # AFTER publish: prove the just-released packages work by building and testing
  # the examples against crates.io (no source.toml patch). The pre-publish check
  # against local source lives in examples.yml.
  verify-published:
    name: examples vs published crates
    needs: publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Give the crates.io index a moment to serve the just-published versions,
      # then resolve them and run the examples' tests against the real packages.
      - run: sleep 90
      - run: cargo update
      - run: cargo test
