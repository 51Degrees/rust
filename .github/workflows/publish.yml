name: Publish

# Publishes main to crates.io by hand, through common-ci's shared publish, the
# same workflow the 01:00 nightly pipeline runs, as in the other languages. It
# publishes only when main has moved past the last release tag. It works the
# version out from the tags, refuses a major or minor move unless
# allow-version-bump is set, publishes every crate through the ci/*.ps1 hooks,
# then tags the release and creates its GitHub release.
#
# crates.io Trusted Publishing accepts this file and nightly-pipeline.yml, which
# ci/setup-trusted-publishing.sh registers for every crate, so no crates.io
# token is stored. The publish step exchanges the run's GitHub OIDC identity
# for a short-lived token, which needs id-token on the calling job.

on:
  workflow_dispatch:
    inputs:
      dryrun:
        type: boolean
        default: false
      # The only route that can allow a major or minor bump, so that releasing
      # one is a person dispatching this workflow with their name on the run.
      allow-version-bump:
        description: 'Publish even though the version moves the major or minor place.'
        type: boolean
        default: false

# One publish at a time, whether it starts here or in the nightly pipeline.
concurrency:
  group: publish-crates-io
  cancel-in-progress: false

jobs:
  Publish:
    name: Publish
    permissions:
      contents: read
      id-token: write
    uses: 51Degrees/common-ci/.github/workflows/nightly-publish.yml@main
    with:
      repo-name: ${{ github.event.repository.name }}
      org-name: ${{ github.event.repository.owner.login }}
      dryrun: ${{ inputs.dryrun }}
      allow-version-bump: ${{ inputs.allow-version-bump }}
      skip-compare-performance: true
    secrets:
      token: ${{ secrets.ACCESS_TOKEN }}

  # The examples built and tested against the crates on crates.io, with no
  # source.toml patch. The publish already tested them against the crates being
  # released, and this checks the packages as crates.io serves them.
  published-examples:
    name: examples vs published crates
    needs: Publish
    if: ${{ !inputs.dryrun }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo update
      - run: cargo test
