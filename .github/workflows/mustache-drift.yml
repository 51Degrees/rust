name: Mustache Drift Check

# The javascript-builder crate bundles a copy of JavaScriptResource.mustache
# (javascript-builder/assets/JavaScriptResource.mustache). This is the same
# client-side bootstrap template every 51Degrees JavaScriptBuilder element ships,
# and it must stay byte-for-byte identical to the canonical upstream so the Rust
# pipeline emits the same 51Degrees.core.js the other languages do.
#
# The canonical copy now lives in the shared 51Degrees/javascript-templates
# repository, which is the single source every language binding consumes (the
# .NET, Node, Python and PHP pipelines all derive their bundled copy from it).
# This job downloads that file and diffs it against the bundled copy. A drift
# fails the build so the bundled template is refreshed deliberately rather than
# silently going stale.
#
# Why the upstream reference is pinned. The canonical template is being changed
# by the create last programme, 51Degrees/cloud#373, so comparing every push and
# pull request against the moving branch would fail work in this repository that
# has nothing to do with that programme. Push and pull request builds therefore
# compare against the commit the bundled asset was taken from, whilst the weekly
# schedule and a manual run still compare against the branch so a real drift is
# reported. 51Degrees/rust#52 is the issue that lifts the pin, by moving the
# bundled asset and UPSTREAM_PINNED_REF to the same new commit in one pull
# request, which is then green on its own.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 04:00 every Monday, so upstream changes are caught even with no PR activity.
    - cron: '0 4 * * 1'

jobs:
  mustache-drift:
    name: JavaScriptResource.mustache drift
    runs-on: ubuntu-latest
    env:
      BUNDLED: javascript-builder/assets/JavaScriptResource.mustache
      UPSTREAM_REPO: 51Degrees/javascript-templates
      UPSTREAM_PATH: JavaScriptResource.mustache
      # The commit the bundled asset was taken from, used by push and pull
      # request builds. Move this and the bundled asset together, never one
      # without the other.
      UPSTREAM_PINNED_REF: 13ba5e7db47f88efc3440377121958b4aee1d3ac
      # The moving branch, used by the weekly schedule and by a manual run, so
      # an upstream change is still reported once a week. A failure here is the
      # signal to prepare the refresh, not a fault in whatever was pushed.
      UPSTREAM_TRACKING_REF: main
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Choose the upstream reference to compare against
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            schedule|workflow_dispatch)
              ref="$UPSTREAM_TRACKING_REF"
              kind="tracking branch"
              ;;
            *)
              ref="$UPSTREAM_PINNED_REF"
              kind="pinned commit"
              ;;
          esac
          echo "Event ${EVENT_NAME} compares against the ${kind} ${ref}."
          echo "UPSTREAM_REF=${ref}" >> "$GITHUB_ENV"
          echo "UPSTREAM_REF_KIND=${kind}" >> "$GITHUB_ENV"

      - name: Download canonical upstream template
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/${UPSTREAM_REPO}/${UPSTREAM_REF}/${UPSTREAM_PATH}"
          echo "Fetching $url"
          # --fail makes curl exit non-zero on a 404, which surfaces a moved
          # upstream path instead of diffing against an HTML error page.
          curl --fail --silent --show-error --location "$url" --output upstream.mustache
          if [ ! -s upstream.mustache ]; then
            echo "::error::Downloaded upstream template is empty. The upstream path may have moved: ${UPSTREAM_PATH}"
            exit 1
          fi

      - name: Diff bundled template against upstream
        run: |
          set -euo pipefail
          if diff -u "$BUNDLED" upstream.mustache; then
            echo "Bundled JavaScriptResource.mustache matches ${UPSTREAM_REPO}@${UPSTREAM_REF}, the ${UPSTREAM_REF_KIND}."
          else
            echo "::error file=${BUNDLED}::Bundled JavaScriptResource.mustache differs from ${UPSTREAM_REPO}@${UPSTREAM_REF}, the ${UPSTREAM_REF_KIND}. Refresh the bundled copy, and where the refresh is deliberate move UPSTREAM_PINNED_REF to the same commit in the same pull request. See 51Degrees/rust#52."
            exit 1
          fi
