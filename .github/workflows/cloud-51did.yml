name: Cloud 51Did Tests

# Runs the live cloud 51Did integration test (fodid/tests/cloud_51did.rs) once
# for every resource key the central common-ci script exports from the
# _51DEGREES_RESOURCE_KEY* secrets (free, paid and any added later). Each run
# sets the single _51DEGREES_RESOURCE_KEY the test reads. New resource keys
# are added once at the organisation level; this workflow needs no change.
#
# The test carries #[ignore] so a plain `cargo test` leaves it alone, which is
# why the run below passes --include-ignored. It skips itself when no key is
# set, so a run with no secrets is green and proves nothing. That is
# deliberate, because a pull request from a fork has no secrets, and it is the
# reason the loop below reports which key each run used.
#
# The fodid crate is pure Rust, taking the OWID library as copied source
# rather than through the -sys crates, so this needs none of the C/C++
# checkouts the main build workflow sets up.

on:
  workflow_dispatch:
  # Nightly as well, because a pull_request run only ever checks the package
  # against the cloud as it stood that day. A released package is not checked
  # again, so a field the cloud starts writing, stops writing or changes goes
  # unnoticed until a customer finds it. That is what happened when the cloud service began
  # writing the Terms byte. The six 51Did packages are
  # staggered ten minutes apart so they do not all ask production at once.
  schedule:
    - cron: '50 5 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'fodid/**'
      - 'owid-rust/**'
      - 'ci/copy-owid-source.ps1'
      - '.github/workflows/cloud-51did.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  cloud-51did:
    name: Cloud 51Did
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fodid compiles the owid-rust submodule source, copied in below.
          submodules: recursive
      - name: Checkout common-ci
        uses: actions/checkout@v4
        with:
          # Provides steps/set-resource-keys.ps1, the central script that
          # exports the _51DEGREES_RESOURCE_KEY* secrets as environment
          # variables.
          repository: 51Degrees/common-ci
          path: common-ci
      - uses: dtolnay/rust-toolchain@stable
      - name: Copy the OWID source into the crate
        shell: pwsh
        run: ./ci/copy-owid-source.ps1
      - name: Cloud 51Did test for each resource key secret
        shell: pwsh
        env:
          SECRETS: ${{ toJSON(secrets) }}
        run: |
          ./common-ci/steps/set-resource-keys.ps1 -Keys (ConvertFrom-Json -AsHashtable $env:SECRETS)
          $keys = Get-ChildItem env: |
            Where-Object { $_.Name -like '_51DEGREES_RESOURCE_KEY*' -and $_.Value }
          if (-not $keys) {
            Write-Host 'No _51DEGREES_RESOURCE_KEY* secrets available; skipping.'
            exit 0
          }
          $failed = $false
          foreach ($k in $keys) {
            Write-Host "::group::cloud_51did with $($k.Name)"
            $env:_51DEGREES_RESOURCE_KEY = $k.Value
            cargo test -p fodid --test cloud_51did -- --include-ignored
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            Write-Host '::endgroup::'
          }
          if ($failed) { exit 1 }
