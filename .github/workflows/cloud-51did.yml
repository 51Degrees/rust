name: Cloud 51Did Tests

# Runs the live cloud 51Did integration test (fodid/tests/cloud_51did.rs) once
# for every _51DEGREES_RESOURCE_KEY* secret passed in below. Each run sets the
# single _51DEGREES_RESOURCE_KEY the test reads.
#
# The secrets are named one by one rather than passed as toJSON(secrets).
# GitHub marks a workflow that hands every secret to a step as possibly
# malicious and holds each run until someone approves it by hand. A new
# resource key therefore needs a line here as well as the organisation secret.
#
# The test carries #[ignore] so a plain `cargo test` leaves it alone, which is
# why the run below passes --include-ignored. It skips itself when no key is
# set, so a run with no secrets is green and proves nothing. That is
# deliberate, because a pull request from a fork has no secrets, and it is the
# reason the loop below reports which key each run used.
#
# The fodid crate is pure Rust, taking the OWID library as copied source
# rather than through the -sys crates, so this needs none of the C/C++
# checkouts the main build workflow sets up.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'fodid/**'
      - 'owid-rust/**'
      - 'ci/copy-owid-source.ps1'
      - '.github/workflows/cloud-51did.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  cloud-51did:
    name: Cloud 51Did
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fodid compiles the owid-rust submodule source, copied in below.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Copy the OWID source into the crate
        shell: pwsh
        run: ./ci/copy-owid-source.ps1
      - name: Cloud 51Did test for each resource key secret
        shell: pwsh
        env:
          _51DEGREES_RESOURCE_KEY_FREE: ${{ secrets._51DEGREES_RESOURCE_KEY_FREE }}
          _51DEGREES_RESOURCE_KEY_PAID: ${{ secrets._51DEGREES_RESOURCE_KEY_PAID }}
          _51DEGREES_RESOURCE_KEY_BESPOKE: ${{ secrets._51DEGREES_RESOURCE_KEY_BESPOKE }}
        run: |
          $keys = Get-ChildItem env: |
            Where-Object { $_.Name -like '_51DEGREES_RESOURCE_KEY*' -and $_.Value }
          if (-not $keys) {
            Write-Host 'No _51DEGREES_RESOURCE_KEY* secrets available; skipping.'
            exit 0
          }
          $failed = $false
          foreach ($k in $keys) {
            Write-Host "::group::cloud_51did with $($k.Name)"
            $env:_51DEGREES_RESOURCE_KEY = $k.Value
            cargo test -p fodid --test cloud_51did -- --include-ignored
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            Write-Host '::endgroup::'
          }
          if ($failed) { exit 1 }
