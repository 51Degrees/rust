name: Throwaway mutant run of the alphabet test
on:
  push:
    branches: [tmp/rust-alphabet-mutant]
jobs:
  mutant:
    name: fodid tests with a lenient decoder
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Copy the OWID source into fodid
        shell: pwsh
        run: ./ci/copy-owid-source.ps1
      - name: The fodid tests
        run: cargo test -p fodid --test fodid_tests
