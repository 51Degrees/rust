name: Caching on WebAssembly

# Lints and tests fiftyone-caching, the loading cache included, on the two
# WebAssembly targets services built with it run on. The native build in
# pull-request.yml covers it on every operating system through the workspace,
# and its wasm job tests the crate on wasm32-wasip1 with default features off.
#
# Here wasm32-wasip1 runs with default features, so DataKeyedCache and the
# pipeline are covered there too, under wasmtime. wasm32-unknown-unknown runs
# with default features off, since only the pipeline feature needs
# fiftyone-pipeline-core, which brings getrandom. That target has no clock and
# no randomness, so it catches any use of Instant, SystemTime::now or a
# run-time seed. Its tests run under Node because the crate imports nothing
# from its host. The standard library prints nothing there, so
# ci/run-wasm-unknown.mjs reports a failing test through the exit status
# alone. Doctests are left out on that target because they use the system
# clock, which it lacks.
#
# The crate needs neither the C/C++ sources nor the submodules, and this
# workflow reads no secrets.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref cancels an in-flight run so the queue stays short.
concurrency:
  group: caching-wasm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fail the build on any compiler or rustdoc warning.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  CARGO_TERM_COLOR: always

jobs:
  wasip1:
    name: caching (wasm32-wasip1)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Install Rust toolchain with wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: caching-wasm32-wasip1

      - name: Install wasmtime (the wasm test runner)
        uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: cargo clippy (wasm32-wasip1)
        run: cargo clippy -p fiftyone-caching --all-targets --target wasm32-wasip1 -- -D warnings

      - name: cargo test (wasm32-wasip1, executed under wasmtime)
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        run: cargo test -p fiftyone-caching --target wasm32-wasip1

  unknown:
    name: caching (wasm32-unknown-unknown)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Install Rust toolchain with wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: caching-wasm32-unknown-unknown

      - name: Install Node (the wasm test runner)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: cargo clippy (wasm32-unknown-unknown, default features off)
        run: cargo clippy -p fiftyone-caching --no-default-features --all-targets --target wasm32-unknown-unknown -- -D warnings

      - name: cargo test (wasm32-unknown-unknown, default features off, executed under Node)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: node ${{ github.workspace }}/ci/run-wasm-unknown.mjs
        run: cargo test -p fiftyone-caching --no-default-features --target wasm32-unknown-unknown --tests
