name: Examples

# The example crates live in their own workspace (examples/) and depend on the 
# PUBLISHED 51Degrees crates from crates.io by default. This workflow is the
# BEFORE-publish gate: it tests the examples against the LOCAL source tree
# (cargo --config source.toml), so a change is validated through the examples
# before it ships. The AFTER-publish check, that the RELEASED packages work,
# runs in publish.yml once a release has been published, and the published
# job below is the same check, run by hand on a branch before a release.
#
# The contract job runs the shared browser tests against the two device
# detection web examples built from this checkout. It can be started by hand
# on any branch with: gh workflow run Examples --ref <branch>

on:
  pull_request:
  # A push to a branch that pull requests target also saves the week's Lite
  # IP Intelligence file where those pull requests can restore it, as the
  # steps that restore and save it say.
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

jobs:
  source:
    name: examples vs local source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: examples
    env:
      # The data files the examples' tests read, one per line. The download
      # and the check below both take this list, so they cannot drift apart.
      DATA_FILES: |
        cxx/data/device-detection/51Degrees-LiteV4.1.hash
        cxx/data/device-detection/20000 Evidence Records.yml
        cxx/data/device-detection/20000 User Agents.csv
        cxx/data/ip-intelligence/51Degrees-IPIV4AsnIpiV41.ipi
    steps:
      # The owid-rust submodule holds the OWID source that the fodid crate
      # compiles in, so it is needed whenever an example reaches fodid
      # through the local source patch. The cxx submodule holds the C sources
      # the -sys crates compile and, at cxx/data, the data repository that
      # links the data files the on-premise examples read, so the checkout is
      # recursive.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The test step versions the crates from the release tags.
          fetch-depth: 0
      # The examples reach the 51Degrees crates through crates.io, and
      # source.toml is the one route to this tree. The script fails on a path
      # dependency into the workspace, a crate missing from source.toml or a
      # lock written during a source build, because the only build against
      # the published crates runs after a release, too late to stop one.
      - name: Check the examples take the crates from crates.io
        shell: pwsh
        working-directory: .
        run: ./ci/check-examples-sources.ps1
      - uses: dtolnay/rust-toolchain@stable
      # ci/copy-owid-source.ps1 copies that source into fodid/src/owid, which
      # git ignores, so fodid cannot compile from the local tree without it.
      # The step runs at the repository root rather than in examples.
      - name: Copy the OWID source into fodid
        shell: pwsh
        working-directory: .
        run: ./ci/copy-owid-source.ps1
      # The data repository holds a link for each data file rather than the
      # file, and its own script downloads them. As in pull-request.yml, the
      # files come from the entry the Data Files workflow saves in the Actions
      # cache each day. The script keeps a restored file and downloads only
      # one that was not restored. A file that is missing fails the job at the
      # check, because the examples' tests would skip without it. Until a
      # daily entry exists, the files a job downloads are saved for later runs
      # here that day.
      - name: Restore the data files
        id: data
        uses: ./.github/actions/restore-data-files
      - name: Download any data file not restored
        continue-on-error: true
        shell: pwsh
        working-directory: .
        run: |
          $names = $env:DATA_FILES.Trim() -split '\r?\n' |
            ForEach-Object { Split-Path -Leaf $_.Trim() }
          ./cxx/data/get-data-files.ps1 @names
      - name: Check the data files
        shell: bash
        working-directory: .
        run: |
          while IFS= read -r file; do
            if [ -n "$file" ] && [ ! -f "$file" ]; then
              echo "::error::$file is missing, so the on-premise examples' tests would skip"
              exit 1
            fi
          done <<< "$DATA_FILES"
      # As in pull-request.yml, only when nothing was restored, and with the
      # action's paths, because an entry is found only by the list it was
      # saved with.
      - name: Save the data files for later runs today
        if: steps.data.outputs.save-key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.data.outputs.paths }}
          key: ${{ steps.data.outputs.save-key }}
          enableCrossOsArchive: true
      # Build and test the examples against this tree's crates. The script gives
      # the crates the next patch above the latest release, so Cargo takes them
      # through source.toml in place of the published ones, and fails if any
      # example still takes one from crates.io. The on-premise examples' tests
      # read the data files downloaded above. The tests that need a resource
      # key or an Enterprise file skip, because the job has neither.
      - name: Test the examples against this tree's crates
        shell: pwsh
        working-directory: .
        run: ./ci/test-examples-against-source.ps1
      # The examples that need no key as someone who has just cloned the
      # repository runs them, with no settings, so each finds the free data
      # files in cxx/data itself. Each must run and end with its "Find out
      # more" section, and one that reads a 51Degrees data file must give the
      # link for asking about the Enterprise data file. It runs even when a
      # test failed, so the log shows both.
      # Every on-premise IP Intelligence example but performance and update
      # reads the Lite IP Intelligence file, a download of about 455 MB that
      # the daily entry does not hold, so the file has an entry of its own for
      # the week. Each example that reads it finds it restored, and on a miss
      # ci/run-examples-on-free-data.ps1 downloads it once before the examples
      # start. Each system has its own entry, so on a miss Windows downloads
      # the file through the PowerShell script, as Linux does through the
      # shell script, rather than restoring the copy Linux saved.
      # Only a run that is not for a pull request saves the entry, because
      # an entry a pull request saves can be restored by that pull request
      # alone. A pull request restores the entry a push to its base branch or
      # to main saved this week, and downloads the file when neither has one.
      - name: Name the week for the Lite IP Intelligence file
        id: week
        if: ${{ !cancelled() }}
        shell: bash
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the Lite IP Intelligence file
        id: ipi-lite
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v4
        with:
          path: cxx/data/ip-intelligence/51Degrees-LiteV41.ipi
          key: ipi-lite-v41-${{ runner.os }}-${{ steps.week.outputs.week }}
      - name: Run the examples that need no key on the free data files
        if: ${{ !cancelled() }}
        shell: pwsh
        working-directory: .
        run: ./ci/run-examples-on-free-data.ps1
      # A file that was not downloaded leaves nothing to save, which is not a
      # failure of this job.
      - name: Save the Lite IP Intelligence file for later runs this week
        if: >-
          ${{ !cancelled() && github.event_name != 'pull_request' &&
          steps.ipi-lite.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: cxx/data/ip-intelligence/51Degrees-LiteV41.ipi
          key: ipi-lite-v41-${{ runner.os }}-${{ steps.week.outputs.week }}

  # The check publish.yml runs after a release, here so that it can be run by
  # hand on a branch before one: gh workflow run Examples --ref <branch>. It
  # builds the examples against the crates on crates.io, so an example that
  # needs a change not yet released fails here until the release, which is
  # why it does not run on pull requests.
  published:
    name: examples vs published crates
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo update
      - run: cargo test

  # The Contract category of the shared selenium-api-tests suite
  # (https://github.com/51Degrees/selenium-api-tests), run against both device
  # detection web examples, as every other SDK's device detection CI does.
  # The cloud example talks to the public cloud with the bespoke resource key,
  # the one the Node and Python SDKs run this suite with.
  # The on-premise example loads the TAC data file, because the Lite file has
  # neither DeviceType nor the screen size JavaScript properties the contract
  # checks. Any failed or skipped test fails the job (see
  # ci/run-browser-contract.ps1). One Linux runner is enough for a browser
  # contract, and its image carries Chrome and Firefox.
  contract:
    name: browser contract (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [cloud, onpremise]
    steps:
      # The script builds the example from this checkout's crates, whose -sys
      # crates compile the C sources in the cxx submodule. Its data
      # submodules are not needed, because the TAC file is fetched below. The
      # crates are versioned from the release tags.
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples
          key: browser-contract
      # The suite targets net10.0, which the runner image is not guaranteed
      # to carry.
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # A pull request from a fork gets no secrets, so it skips with a warning.
      # Anywhere else a missing secret is an error, because a run that skips
      # has checked nothing.
      - name: Check the secrets are available
        id: secrets
        shell: pwsh
        env:
          _51DEGREES_RESOURCE_KEY: ${{ secrets._51DEGREES_RESOURCE_KEY_BESPOKE }}
          DEVICE_DETECTION_KEY: ${{ secrets.DEVICE_DETECTION_KEY }}
          DEVICE_DETECTION_URL: ${{ secrets.DEVICE_DETECTION_URL }}
          FROM_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
          MODE: ${{ matrix.mode }}
        run: |
          $missing = @()
          if (-not $env:_51DEGREES_RESOURCE_KEY) {
            $missing += '_51DEGREES_RESOURCE_KEY_BESPOKE'
          }
          if ($env:MODE -eq 'onpremise' -and
              -not $env:DEVICE_DETECTION_KEY -and -not $env:DEVICE_DETECTION_URL) {
            $missing += 'DEVICE_DETECTION_KEY or DEVICE_DETECTION_URL'
          }
          if (-not $missing) {
            'run=true' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $list = $missing -join ', '
          if ($env:FROM_FORK -eq 'true') {
            Write-Host "::warning title=No secrets::A fork has no $list, so the contract is skipped."
            'run=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          Write-Host "::error title=Missing secrets::$list not available to this workflow."
          exit 1
      # The same shared step every other repository uses to fetch data files,
      # cached for the day.
      - name: Fetch the TAC data file
        if: matrix.mode == 'onpremise' && steps.secrets.outputs.run == 'true'
        uses: 51Degrees/common-ci/actions/fetch-assets@main
        with:
          assets: TAC-HashV41.hash
          cache: true
          device-detection-key: ${{ secrets.DEVICE_DETECTION_KEY }}
          device-detection-url: ${{ secrets.DEVICE_DETECTION_URL }}
      - name: Contract tests
        if: steps.secrets.outputs.run == 'true'
        shell: pwsh
        env:
          _51DEGREES_RESOURCE_KEY: ${{ secrets._51DEGREES_RESOURCE_KEY_BESPOKE }}
        run: >-
          ./ci/run-browser-contract.ps1
          -Mode ${{ matrix.mode }}
          -ResourceKey $env:_51DEGREES_RESOURCE_KEY
          -DataFile assets/TAC-HashV41.hash
