name: Examples

# The example crates live in their own workspace (examples/) and depend on the 
# PUBLISHED 51Degrees crates from crates.io by default. This workflow is the
# BEFORE-publish gate: it tests the examples against the LOCAL source tree
# (cargo --config source.toml), so a change is validated through the examples
# before it ships. The AFTER-publish check, that the RELEASED packages work,
# runs in publish.yml once a release has been published, and the published
# job below is the same check, run by hand on a branch before a release.
#
# The contract job runs the shared browser tests against the two device
# detection web examples built from this checkout. It can be started by hand
# on any branch with: gh workflow run Examples --ref <branch>

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  source:
    name: examples vs local source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: examples
    steps:
      # The owid-rust submodule holds the OWID source that the fodid crate
      # compiles in, so it is needed whenever an example reaches fodid
      # through the local source patch.
      - uses: actions/checkout@v4
        with:
          submodules: true
          # The test step versions the crates from the release tags.
          fetch-depth: 0
      # The examples reach the 51Degrees crates through crates.io, and
      # source.toml is the one route to this tree. The script fails on a path
      # dependency into the workspace, a crate missing from source.toml or a
      # lock written during a source build, because the only build against
      # the published crates runs after a release, too late to stop one.
      - name: Check the examples take the crates from crates.io
        shell: pwsh
        working-directory: .
        run: ./ci/check-examples-sources.ps1
      - uses: dtolnay/rust-toolchain@stable
      # ci/copy-owid-source.ps1 copies that source into fodid/src/owid, which
      # git ignores, so fodid cannot compile from the local tree without it.
      # The step runs at the repository root rather than in examples.
      - name: Copy the OWID source into fodid
        shell: pwsh
        working-directory: .
        run: ./ci/copy-owid-source.ps1
      # The data files the on-premise examples read come from the C repositories
      # at the commits the vendored sources record, so they are in a format
      # those sources read. Each checkout sits inside the workspace under the
      # name the examples look for in the directories above their own.
      - name: Read the vendored C commits
        id: vendored
        shell: bash
        working-directory: .
        run: |
          echo "device-detection=$(sed -n 's/^commit=//p' device-detection-sys/vendor/UPSTREAM.txt)" >> "$GITHUB_OUTPUT"
          echo "ip-intelligence=$(sed -n 's/^commit=//p' ip-intelligence-sys/vendor/UPSTREAM.txt)" >> "$GITHUB_OUTPUT"
      - name: Checkout device-detection-cxx
        uses: actions/checkout@v4
        with:
          repository: 51Degrees/device-detection-cxx
          ref: ${{ steps.vendored.outputs.device-detection }}
          path: device-detection-cxx
          submodules: recursive
      - name: Checkout ip-intelligence-cxx
        uses: actions/checkout@v4
        with:
          repository: 51Degrees/ip-intelligence-cxx
          ref: ${{ steps.vendored.outputs.ip-intelligence }}
          path: ip-intelligence-cxx
          submodules: recursive
      # The data files are Git LFS content inside the data submodules, which
      # actions/checkout leaves as pointers, so fetch them. A file that is
      # missing, or is still a pointer, fails the job here, because the
      # examples' tests would skip without it.
      - name: Fetch the data files
        shell: bash
        working-directory: .
        run: |
          for d in device-detection-cxx ip-intelligence-cxx; do
            git -C "$d" lfs install --local
            git -C "$d" lfs pull
            git -C "$d" submodule foreach --recursive 'git lfs install --local && git lfs pull'
          done
          for file in \
            device-detection-cxx/device-detection-data/51Degrees-LiteV4.1.hash \
            ip-intelligence-cxx/ip-intelligence-data/51Degrees-IPIV4AsnIpiV41.ipi; do
            if [ ! -f "$file" ] || head -c 64 "$file" | grep -q 'git-lfs'; then
              echo "::error::$file is missing or is a Git LFS pointer, so the on-premise examples' tests would skip"
              exit 1
            fi
          done
      # Build and test the examples against this tree's crates. The script gives
      # the crates the next patch above the latest release, so Cargo takes them
      # through source.toml in place of the published ones, and fails if any
      # example still takes one from crates.io. The on-premise examples' tests
      # read the Lite Hash and ASN files checked out above. The tests that need
      # a resource key or an Enterprise file skip, because the job has neither.
      - name: Test the examples against this tree's crates
        shell: pwsh
        working-directory: .
        run: ./ci/test-examples-against-source.ps1

  # The check publish.yml runs after a release, here so that it can be run by
  # hand on a branch before one: gh workflow run Examples --ref <branch>. It
  # builds the examples against the crates on crates.io, so an example that
  # needs a change not yet released fails here until the release, which is
  # why it does not run on pull requests.
  published:
    name: examples vs published crates
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo update
      - run: cargo test

  # The Contract category of the shared selenium-api-tests suite
  # (https://github.com/51Degrees/selenium-api-tests), run against both device
  # detection web examples, as every other SDK's device detection CI does.
  # The cloud example talks to the public cloud with the bespoke resource key,
  # the one the Node and Python SDKs run this suite with.
  # The on-premise example loads the TAC data file, because the Lite file has
  # neither DeviceType nor the screen size JavaScript properties the contract
  # checks. Any failed or skipped test fails the job (see
  # ci/run-browser-contract.ps1). One Linux runner is enough for a browser
  # contract, and its image carries Chrome and Firefox.
  contract:
    name: browser contract (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [cloud, onpremise]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples
          key: browser-contract
      # The suite targets net10.0, which the runner image is not guaranteed
      # to carry.
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # A pull request from a fork gets no secrets, so it skips with a warning.
      # Anywhere else a missing secret is an error, because a run that skips
      # has checked nothing.
      - name: Check the secrets are available
        id: secrets
        shell: pwsh
        env:
          RESOURCE_KEY: ${{ secrets._51DEGREES_RESOURCE_KEY_BESPOKE }}
          DEVICE_DETECTION_KEY: ${{ secrets.DEVICE_DETECTION_KEY }}
          DEVICE_DETECTION_URL: ${{ secrets.DEVICE_DETECTION_URL }}
          FROM_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
          MODE: ${{ matrix.mode }}
        run: |
          $missing = @()
          if (-not $env:RESOURCE_KEY) {
            $missing += '_51DEGREES_RESOURCE_KEY_BESPOKE'
          }
          if ($env:MODE -eq 'onpremise' -and
              -not $env:DEVICE_DETECTION_KEY -and -not $env:DEVICE_DETECTION_URL) {
            $missing += 'DEVICE_DETECTION_KEY or DEVICE_DETECTION_URL'
          }
          if (-not $missing) {
            'run=true' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $list = $missing -join ', '
          if ($env:FROM_FORK -eq 'true') {
            Write-Host "::warning title=No secrets::A fork has no $list, so the contract is skipped."
            'run=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          Write-Host "::error title=Missing secrets::$list not available to this workflow."
          exit 1
      # The same shared step every other repository uses to fetch data files,
      # cached for the day.
      - name: Fetch the TAC data file
        if: matrix.mode == 'onpremise' && steps.secrets.outputs.run == 'true'
        uses: 51Degrees/common-ci/actions/fetch-assets@main
        with:
          assets: TAC-HashV41.hash
          cache: true
          device-detection-key: ${{ secrets.DEVICE_DETECTION_KEY }}
          device-detection-url: ${{ secrets.DEVICE_DETECTION_URL }}
      - name: Contract tests
        if: steps.secrets.outputs.run == 'true'
        shell: pwsh
        env:
          RESOURCE_KEY: ${{ secrets._51DEGREES_RESOURCE_KEY_BESPOKE }}
        run: >-
          ./ci/run-browser-contract.ps1
          -Mode ${{ matrix.mode }}
          -ResourceKey $env:RESOURCE_KEY
          -DataFile assets/TAC-HashV41.hash
