name: Examples

# The example crates live in their own workspace (examples/) and depend on the 
# PUBLISHED 51Degrees crates from crates.io by default. This workflow is the
# BEFORE-publish gate: it tests the examples against the LOCAL source tree
# (cargo --config source.toml), so a change is validated through the examples
# before it ships. The AFTER-publish check, that the RELEASED packages work,
# runs in publish.yml once a release has been published.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  source:
    name: examples vs local source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Build and test the examples against the local crates via the patch file.
      # Data-file and resource-key gated tests skip cleanly when those are
      # absent, so this validates the build and the offline tests.
      - run: cargo test --config source.toml
      # Browser contract check via the shared 51Degrees selenium-api-tests
      # suite (the same pattern every SDK repo uses, via the org-standard
      # ci/run-integration-tests.ps1 script name). The script launches the
      # cloud web example from the local source tree, shallow-clones the suite
      # as a sibling (deliberately not a submodule) and runs its Contract
      # category with headless Chrome. Skips with a warning when no resource
      # key secret is available, for example on a fork PR. Linux only: one
      # platform suffices for a browser contract and the suite drives Chrome
      # through Selenium Manager, which the ubuntu image supports out of the
      # box.
      # The suite targets net10.0 (SeleniumApiTests.csproj), which the runner
      # image is not guaranteed to carry.
      - name: Install .NET SDK
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Selenium contract tests
        if: matrix.os == 'ubuntu-latest'
        working-directory: .
        shell: pwsh
        env:
          RESOURCE_KEY: ${{ secrets._51DEGREES_RESOURCE_KEY_PAID || secrets._51DEGREES_RESOURCE_KEY_FREE }}
        run: ./ci/run-integration-tests.ps1 -TestResourceKey $env:RESOURCE_KEY
