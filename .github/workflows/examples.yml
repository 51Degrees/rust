name: Examples

# The example crates live in their own workspace (examples/) and depend on the 
# PUBLISHED 51Degrees crates from crates.io by default. This workflow is the
# BEFORE-publish gate: it tests the examples against the LOCAL source tree
# (cargo --config source.toml), so a change is validated through the examples
# before it ships. The AFTER-publish check, that the RELEASED packages work,
# runs in publish.yml once a release has been published.
#
# The contract job runs the shared browser tests against the two device
# detection web examples built from this checkout. It can be started by hand
# on any branch with: gh workflow run Examples --ref <branch>

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  source:
    name: examples vs local source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Build and test the examples against the local crates via the patch file.
      # Data-file and resource-key gated tests skip cleanly when those are
      # absent, so this validates the build and the offline tests.
      - run: cargo test --config source.toml

  # The Contract category of the shared selenium-api-tests suite
  # (https://github.com/51Degrees/selenium-api-tests), run against both device
  # detection web examples, as every other SDK's device detection CI does.
  # The cloud example talks to the public cloud with the paid resource key.
  # The on-premise example loads the TAC data file, because the Lite file has
  # neither DeviceType nor the screen size JavaScript properties the contract
  # checks. Any failed or skipped test fails the job (see
  # ci/run-browser-contract.ps1). One Linux runner is enough for a browser
  # contract, and its image carries Chrome and Firefox.
  contract:
    name: browser contract (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [cloud, onpremise]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples
          key: browser-contract
      # The suite targets net10.0, which the runner image is not guaranteed
      # to carry.
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # A pull request from a fork gets no secrets, so it skips with a warning.
      # Anywhere else a missing secret is an error, because a run that skips
      # has checked nothing.
      - name: Check the secrets are available
        id: secrets
        shell: pwsh
        env:
          RESOURCE_KEY: ${{ secrets._51DEGREES_RESOURCE_KEY_PAID }}
          DEVICE_DETECTION_KEY: ${{ secrets.DEVICE_DETECTION_KEY }}
          DEVICE_DETECTION_URL: ${{ secrets.DEVICE_DETECTION_URL }}
          FROM_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
          MODE: ${{ matrix.mode }}
        run: |
          $missing = @()
          if (-not $env:RESOURCE_KEY) {
            $missing += '_51DEGREES_RESOURCE_KEY_PAID'
          }
          if ($env:MODE -eq 'onpremise' -and
              -not $env:DEVICE_DETECTION_KEY -and -not $env:DEVICE_DETECTION_URL) {
            $missing += 'DEVICE_DETECTION_KEY or DEVICE_DETECTION_URL'
          }
          if (-not $missing) {
            'run=true' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $list = $missing -join ', '
          if ($env:FROM_FORK -eq 'true') {
            Write-Host "::warning title=No secrets::A fork has no $list, so the contract is skipped."
            'run=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          Write-Host "::error title=Missing secrets::$list not available to this workflow."
          exit 1
      # The same shared step every other repository uses to fetch data files,
      # cached for the day.
      - name: Fetch the TAC data file
        if: matrix.mode == 'onpremise' && steps.secrets.outputs.run == 'true'
        uses: 51Degrees/common-ci/actions/fetch-assets@main
        with:
          assets: TAC-HashV41.hash
          cache: true
          device-detection-key: ${{ secrets.DEVICE_DETECTION_KEY }}
          device-detection-url: ${{ secrets.DEVICE_DETECTION_URL }}
      - name: Contract tests
        if: steps.secrets.outputs.run == 'true'
        shell: pwsh
        env:
          RESOURCE_KEY: ${{ secrets._51DEGREES_RESOURCE_KEY_PAID }}
        run: >-
          ./ci/run-browser-contract.ps1
          -Mode ${{ matrix.mode }}
          -ResourceKey $env:RESOURCE_KEY
          -DataFile assets/TAC-HashV41.hash
