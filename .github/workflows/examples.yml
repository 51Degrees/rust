name: Examples

# The example crates live in their own workspace (examples/) and depend on the 
# PUBLISHED 51Degrees crates from crates.io by default. This workflow is the
# BEFORE-publish gate: it tests the examples against the LOCAL source tree
# (cargo --config source.toml), so a change is validated through the examples
# before it ships. The AFTER-publish check, that the RELEASED packages work,
# runs in publish.yml once a release has been published.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  source:
    name: examples vs local source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: examples
    steps:
      # The owid-rust submodule holds the OWID source that the fodid crate
      # compiles in, so it is needed whenever an example reaches fodid
      # through the local source patch.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      # ci/copy-owid-source.ps1 copies that source into fodid/src/owid, which
      # git ignores, so fodid cannot compile from the local tree without it.
      # The step runs at the repository root rather than in examples.
      - name: Copy the OWID source into fodid
        shell: pwsh
        working-directory: .
        run: ./ci/copy-owid-source.ps1
      # Build and test the examples against the local crates via the patch file.
      # Data-file and resource-key gated tests skip cleanly when those are
      # absent, so this validates the build and the offline tests.
      - run: cargo test --config source.toml
      # The browser contract for this SDK runs in the cloud repository, in its
      # language matrix, against the container that run builds. It used to run
      # here against cloud.51degrees.com, which made this the only SDK testing
      # production data rather than the code under review, and left it red for
      # a fault in production that nothing here could fix.
