name: Throwaway red run of the factor word test
on:
  push:
    branches: [tmp/rust-factor-red]
jobs:
  red:
    name: factor word test against rc's code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Copy the OWID source into fodid
        shell: pwsh
        run: ./ci/copy-owid-source.ps1
      - name: The redeem tests
        run: cargo test -p fodid-client --lib redeem
