[package]
name = "fiftyone-caching"
version = "4.5.2"
description = "Sharded-LRU cache trait and default implementation for the 51Degrees pipeline."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["pipeline"]
# DataKeyedCache, which keys a cache by a flow data's evidence. Only it needs
# fiftyone-pipeline-core, so turning this off lets the rest of the crate build
# for wasm32-unknown-unknown.
pipeline = ["dep:fiftyone-pipeline-core"]

[dependencies]
fiftyone-pipeline-core = { version = "4.5.2", path = "../pipeline-core", optional = true }
# A current insertion-ordered hash map. Moving an entry to the back on access
# and popping from the front gives least-recently-used eviction per shard.
hashlink = "0.10"

# Native builds seed ahash at run time from the operating system.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ahash.workspace = true

# WebAssembly builds seed ahash when the crate is compiled, so getrandom, which
# does not build for wasm32-unknown-unknown without a JavaScript backend, never
# reaches them.
[target.'cfg(target_family = "wasm")'.dependencies]
ahash = { version = "0.8", default-features = false, features = ["std", "compile-time-rng"] }

[package.metadata.docs.rs]
# Build the documentation on docs.rs with every feature enabled, so the
# cloud, on-premise and optional paths are all documented.
all-features = true
