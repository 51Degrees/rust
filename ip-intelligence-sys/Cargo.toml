[package]
name = "fiftyone-ip-intelligence-sys"
version = "4.5.2"
description = "Raw FFI bindings to the Ipi IP-intelligence ABI in the 51Degrees C library, including the weighted getters. Builds and statically links the fiftyone-ip-intelligence-c native library."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
links = "fiftyone-ip-intelligence-c"
build = "build.rs"
# The C sources under cxx are ignored by git, because
# ci/copy-cxx-sources.ps1 copies them from the cxx submodule before
# packaging, and cargo leaves an ignored directory out of a package unless
# the manifest lists it. A build in the workspace reads the submodule instead.
include = ["src/**", "cxx/**", "build.rs", "README.md"]

[dependencies]
# No dependency on fiftyone-common-sys. The IP Intelligence engine is compiled
# with 64 bit file offsets (FIFTYONE_DEGREES_LARGE_DATA_FILE_SUPPORT) and links
# its own copy of the common C library. Pulling in the common crate's native library,
# which is built with 32 bit offsets, would duplicate the common C library symbols at
# an incompatible ABI and corrupt the data set header read. The handful of
# shared common types are declared locally in the `common` module instead.

[build-dependencies]
cc = "1.2"

[package.metadata.docs.rs]
# Build the documentation on docs.rs with every feature enabled, so the
# cloud, on-premise and optional paths are all documented.
all-features = true
