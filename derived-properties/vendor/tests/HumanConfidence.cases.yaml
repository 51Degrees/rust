# Conformance cases for scripts/HumanConfidence.yaml.
#
# Every language implementation runs these cases and must give the same
# answer for every one. A property that is not listed is absent. A property
# written as { String: "..." } arrives as the string form of the value
# rather than the native type, which is how a value read from a data file
# or from a cloud response usually arrives.
#
# The script names eight source properties and every one of them is
# necessary, because a property is either present or it is not. Where one
# is absent the whole property has no value and the message names every
# property that could not be read, which is what Expect: { Missing: [...] }
# below asserts.
#
# Two of the eight, device.IsVisible and device.HasWebDriver, carry the
# string Unknown until the 51Degrees JavaScript has run, and the script
# reads both as strings so that it can see that value rather than losing
# it. The case named "the first request of a session, before the
# JavaScript has run" is the one a reader should look at first, and the
# block at the end of this file writes out the whole table of what the
# script answers for each of True, Unknown and False.
#
# Between them these cases reach every rule and all three output values,
# which `node tools/run-cases.mjs` checks and fails on.

Script: HumanConfidence
Cases:

  # High. All three counted checks passed and no decisive check fired.
  - Name: every check passes
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: false
      device.IsHeadless: false
      device.IsVisible: true
      device.BrowserReleaseYear: 2026
      device.BrowserReleaseAge: 1
      ip.HumanProbability: 9
      ip.ConnectionType: Broadband
    Expect: { Value: High }

  # The same request with every value in its string form, which must be
  # read exactly as the native form was.
  - Name: every check passes, every value in its string form
    Properties:
      device.IsCrawler: { String: "False" }
      device.HasWebDriver: { String: "False" }
      device.IsHeadless: { String: "False" }
      device.IsVisible: { String: "True" }
      device.BrowserReleaseYear: { String: "2026" }
      device.BrowserReleaseAge: { String: "1" }
      ip.HumanProbability: { String: "9" }
      ip.ConnectionType: { String: "Broadband" }
    Expect: { Value: High }

  # A value that arrives as a list of weighted values takes the one with
  # the highest weight.
  - Name: a weighted list takes the value with the highest weight
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: false
      device.IsHeadless: false
      device.IsVisible: true
      device.BrowserReleaseYear: 2026
      device.BrowserReleaseAge: 1
      ip.HumanProbability:
        - { Value: 2, Weight: 1 }
        - { Value: 9, Weight: 9 }
      ip.ConnectionType: Broadband
    Expect: { Value: High }

  # Low. A declared crawler is Low on its own. Every counted check passes
  # here, so the High rule would match if the rules were read in any other
  # order. This case is what proves first match wins.
  - Name: a declared crawler with every other check passing
    Properties:
      device.IsCrawler: true
      device.HasWebDriver: false
      device.IsHeadless: false
      device.IsVisible: true
      device.BrowserReleaseYear: 2026
      device.BrowserReleaseAge: 1
      ip.HumanProbability: 9
      ip.ConnectionType: Broadband
    Expect: { Value: Low }

  # Low. A browser advertising a web driver is under automation, which is
  # decisive whatever else says. Every counted check passes.
  - Name: a browser advertising a web driver
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: true
      device.IsHeadless: false
      device.IsVisible: true
      device.BrowserReleaseYear: 2026
      device.BrowserReleaseAge: 1
      ip.HumanProbability: 9
      ip.ConnectionType: Broadband
    Expect: { Value: Low }

  # Low. A browser advertising no visible window, again decisive with
  # every counted check passing.
  - Name: a headless browser
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: false
      device.IsHeadless: true
      device.IsVisible: true
      device.BrowserReleaseYear: 2026
      device.BrowserReleaseAge: 1
      ip.HumanProbability: 9
      ip.ConnectionType: Broadband
    Expect: { Value: Low }

  # Medium. One counted check failed, being IsVisible, because the page
  # was in a background tab when the JavaScript ran.
  - Name: one failed check, the window was not in view
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: false
      device.IsHeadless: false
      device.IsVisible: false
      device.BrowserReleaseYear: 2026
      device.BrowserReleaseAge: 1
      ip.HumanProbability: 9
      ip.ConnectionType: Broadband
    Expect: { Value: Medium }

  # Medium. One counted check failed, being BrowserIsCurrent, because the
  # browser was released seven years ago.
  - Name: one failed check, an old browser
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: false
      device.IsHeadless: false
      device.IsVisible: true
      device.BrowserReleaseYear: 2019
      device.BrowserReleaseAge: 84
      ip.HumanProbability: 9
      ip.ConnectionType: Broadband
    Expect: { Value: Medium }

  # An unrated IP address does not count against the request. The data
  # supplies -1 for an address it has not rated, which is a real value
  # rather than an absent property, so AddressNotAgainstHuman is written
  # with an Any that treats -1 as "the address is not evidence against a
  # human". Every counted check passes here and the answer is High.
  - Name: an unrated IP address does not count against the request
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: false
      device.IsHeadless: false
      device.IsVisible: true
      device.BrowserReleaseYear: 2026
      device.BrowserReleaseAge: 1
      ip.HumanProbability: -1
      ip.ConnectionType: Cellular
    Expect: { Value: High }

  # The same guard must not swallow a rated low address. 2 is inside the
  # published 0 to 3 low band, so both members of the Any are false and the
  # check fails, which is the case that proves the guard is a guard rather
  # than a way of ignoring the property.
  - Name: a rated low address still fails the check
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: false
      device.IsHeadless: false
      device.IsVisible: true
      device.BrowserReleaseYear: 2026
      device.BrowserReleaseAge: 1
      ip.HumanProbability: 2
      ip.ConnectionType: Broadband
    Expect: { Value: Medium }

  # 7 is the published line for high confidence, so it must pass. This
  # case pins the threshold to the published band rather than to a
  # stricter line nobody recorded a reason for.
  - Name: the published high confidence line of 7 passes
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: false
      device.IsHeadless: false
      device.IsVisible: true
      device.BrowserReleaseYear: 2026
      device.BrowserReleaseAge: 1
      ip.HumanProbability: 7
      ip.ConnectionType: Broadband
    Expect: { Value: High }

  # The Else, Low. Two counted checks failed, being BrowserIsCurrent and
  # AddressNotAgainstHuman.
  - Name: two failed checks, an old browser on a hosting IP address
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: false
      device.IsHeadless: false
      device.IsVisible: true
      device.BrowserReleaseYear: 2019
      device.BrowserReleaseAge: 84
      ip.HumanProbability: 2
      ip.ConnectionType: Broadband
    Expect: { Value: Low }

  # Three counted checks failed, which is the Else again. The window was
  # measured and was not in view, the browser is seven years old and the
  # address is rated low, and only the connection passes.
  - Name: a window not in view, an old browser and a low rated address
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: false
      device.IsHeadless: false
      device.IsVisible: false
      device.BrowserReleaseYear: 2019
      device.BrowserReleaseAge: 84
      ip.HumanProbability: 2
      ip.ConnectionType: Broadband
    Expect: { Value: Low }

  # No value, one property absent. The device element is in the pipeline
  # and answered for the others, so this is a property that was excluded
  # from the engine configuration or from the resource key.
  - Name: one absent property leaves no value
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: false
      device.IsHeadless: false
      device.IsVisible: true
      device.BrowserReleaseYear: 2026
      ip.HumanProbability: 9
      ip.ConnectionType: Broadband
    Expect: { Missing: [ device.BrowserReleaseAge ] }

  # No value, a whole element absent. HumanProbability is the only
  # property this script takes from the ip element, so a pipeline built
  # without the IP intelligence engine looks exactly like this.
  - Name: the ip element is not in the pipeline
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: false
      device.IsHeadless: false
      device.IsVisible: true
      device.BrowserReleaseYear: 2026
      device.BrowserReleaseAge: 1
    Expect:
      Missing:
        - ip.HumanProbability
        - ip.ConnectionType

  # No value, an unmatched browser. BrowserReleaseYear carries the string
  # Unknown, which is never read as zero, so the property is absent and
  # the whole derived property is absent with it.
  - Name: an unmatched browser leaves no value
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: false
      device.IsHeadless: false
      device.IsVisible: true
      device.BrowserReleaseYear: { String: "Unknown" }
      device.BrowserReleaseAge: 1
      ip.HumanProbability: 9
      ip.ConnectionType: Broadband
    Expect: { Missing: [ device.BrowserReleaseYear ] }

  # Values that mean "no value" are never coerced into the type a script
  # infers. N/A is not false, the string Unknown is not zero and an empty
  # string is not false, so every property the script reads as a Bool or
  # as an Int is absent here and the message must name all of them rather
  # than only the first. device.IsVisible and device.HasWebDriver are read
  # as strings, so Unknown reads as itself and both are present, which is
  # the whole point of reading those two as strings.
  - Name: N/A, Unknown and empty strings never become false or zero
    Properties:
      device.IsCrawler: { String: "N/A" }
      device.HasWebDriver: { String: "Unknown" }
      device.IsHeadless: { String: "N/A" }
      device.IsVisible: { String: "Unknown" }
      device.BrowserReleaseYear: { String: "Unknown" }
      device.BrowserReleaseAge: { String: "N/A" }
      ip.HumanProbability: { String: "" }
    Expect:
      Missing:
        - device.IsCrawler
        - device.IsHeadless
        - device.BrowserReleaseYear
        - device.BrowserReleaseAge
        - ip.HumanProbability
        - ip.ConnectionType

  # Nothing at all arrived, which is the pipeline built without either
  # source engine.
  - Name: nothing available
    Properties: {}
    Expect:
      Missing:
        - device.IsCrawler
        - device.HasWebDriver
        - device.IsHeadless
        - device.IsVisible
        - device.BrowserReleaseYear
        - device.BrowserReleaseAge
        - ip.HumanProbability
        - ip.ConnectionType

  # The format fixes int at a signed 32 bit whole number, so a value
  # outside that range cannot be read and the property is absent. This
  # case is here because it is the one place the width changes an answer
  # rather than only the wording of a message.
  - Name: a whole number too large for an int cannot be read
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: false
      device.IsHeadless: false
      device.IsVisible: true
      device.BrowserReleaseYear: 2026
      device.BrowserReleaseAge: 1
      ip.HumanProbability: { String: "3000000000" }
      ip.ConnectionType: Broadband
    Expect: { Missing: [ ip.HumanProbability ] }

  # Medium, and the case to read first. The 51Degrees JavaScript has not
  # run, so device.IsVisible and device.HasWebDriver both carry Unknown.
  # Every server side check passes and the window was never measured, so
  # the answer is capped at Medium rather than reaching High, and the
  # unmeasured window costs the request nothing. A pipeline that never
  # runs the JavaScript looks exactly like this on every request.
  - Name: the first request of a session, before the JavaScript has run
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: { String: "Unknown" }
      device.IsHeadless: false
      device.IsVisible: { String: "Unknown" }
      device.BrowserReleaseYear: 2026
      device.BrowserReleaseAge: 1
      ip.HumanProbability: 9
      ip.ConnectionType: Broadband
    Expect: { Value: Medium }

  # Medium. One counted check failed, being ConnectionCarriesPeople,
  # because the address is on a hosting or anonymising connection. The
  # value is written with an ampersand because that is what the data
  # carries, whilst the published description of the property spells it
  # with the word and. A script following the description would never
  # match this case, which is why it is here.
  - Name: one failed check, a hosting connection
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: false
      device.IsHeadless: false
      device.IsVisible: true
      device.BrowserReleaseYear: 2026
      device.BrowserReleaseAge: 1
      ip.HumanProbability: 9
      ip.ConnectionType: Hosting & Anonymous
    Expect: { Value: Medium }

  # Cellular passes, being the other connection people browse on.
  - Name: a cellular connection passes
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: false
      device.IsHeadless: false
      device.IsVisible: true
      device.BrowserReleaseYear: 2026
      device.BrowserReleaseAge: 1
      ip.HumanProbability: 9
      ip.ConnectionType: Cellular
    Expect: { Value: High }

  # Unknown fails the check rather than being read as neutral, so a
  # request that is otherwise perfect is Medium and not High. Not knowing
  # whether the connection can have people attached to it is enough to
  # stop a request being called High, and is not evidence of automation,
  # which is what Medium says.
  - Name: an unknown connection is Medium and not High
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: false
      device.IsHeadless: false
      device.IsVisible: true
      device.BrowserReleaseYear: 2026
      device.BrowserReleaseAge: 1
      ip.HumanProbability: 9
      ip.ConnectionType: Unknown
    Expect: { Value: Medium }

  # Two counted checks failed, being the connection and the address, so
  # a hosting connection on a low rated address is Low.
  - Name: a hosting connection on a low rated address
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: false
      device.IsHeadless: false
      device.IsVisible: true
      device.BrowserReleaseYear: 2026
      device.BrowserReleaseAge: 1
      ip.HumanProbability: 1
      ip.ConnectionType: Hosting & Anonymous
    Expect: { Value: Low }

  # ------------------------------------------------------------------
  # The window table, one case for every row of the table in the head
  # comment of the script.
  #
  # Each case below writes device.IsVisible in its string form, being
  # True, Unknown or False, and varies how many of the other three
  # counted checks failed. Those three are BrowserIsCurrent,
  # AddressNotAgainstHuman and ConnectionCarriesPeople, and a case makes
  # one of them fail by ageing the browser to 2019 and a second fail by
  # rating the address 2, which is inside the published 0 to 3 low band.
  # Every other property is held still, so the only thing moving between
  # these cases is the window and the number of other failures.
  #
  #   device.IsVisible   others failed   band
  #   True               0               High
  #   True               1               Medium
  #   True               2 or more       Low
  #   Unknown            0               Medium
  #   Unknown            1               Medium
  #   Unknown            2 or more       Low
  #   False              0               Medium
  #   False              1 or more       Low
  # ------------------------------------------------------------------

  # True, none of the other three failed. High, because the window was
  # measured and was in view and nothing else says otherwise.
  - Name: the window was in view and nothing else failed
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: { String: "False" }
      device.IsHeadless: false
      device.IsVisible: { String: "True" }
      device.BrowserReleaseYear: 2026
      device.BrowserReleaseAge: 1
      ip.HumanProbability: 9
      ip.ConnectionType: Broadband
    Expect: { Value: High }

  # True, one of the other three failed. Medium, being the one failure
  # the Medium rule allows.
  - Name: the window was in view and one other check failed
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: { String: "False" }
      device.IsHeadless: false
      device.IsVisible: { String: "True" }
      device.BrowserReleaseYear: 2019
      device.BrowserReleaseAge: 84
      ip.HumanProbability: 9
      ip.ConnectionType: Broadband
    Expect: { Value: Medium }

  # True, two of the other three failed. Low.
  - Name: the window was in view and two other checks failed
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: { String: "False" }
      device.IsHeadless: false
      device.IsVisible: { String: "True" }
      device.BrowserReleaseYear: 2019
      device.BrowserReleaseAge: 84
      ip.HumanProbability: 2
      ip.ConnectionType: Broadband
    Expect: { Value: Low }

  # Unknown, none of the other three failed. Medium rather than High,
  # which is the whole point of the change. Nobody measured the window,
  # so the request is charged nothing for it and High is still withheld,
  # because High claims a person is viewing the page and nothing here
  # supports that claim.
  - Name: the window was not measured and nothing else failed
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: { String: "Unknown" }
      device.IsHeadless: false
      device.IsVisible: { String: "Unknown" }
      device.BrowserReleaseYear: 2026
      device.BrowserReleaseAge: 1
      ip.HumanProbability: 9
      ip.ConnectionType: Broadband
    Expect: { Value: Medium }

  # Unknown, one of the other three failed. Still Medium, because the
  # unmeasured window spends none of the one failure Medium allows and
  # the old browser spends it instead. This is the shape of request that
  # version 0.4.0 answered Low, being an ordinary person one signal short
  # whose window nobody had measured.
  - Name: the window was not measured and one other check failed
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: { String: "Unknown" }
      device.IsHeadless: false
      device.IsVisible: { String: "Unknown" }
      device.BrowserReleaseYear: 2019
      device.BrowserReleaseAge: 84
      ip.HumanProbability: 9
      ip.ConnectionType: Broadband
    Expect: { Value: Medium }

  # Unknown, two of the other three failed. Low, because two ordinary
  # signals are against the request whatever the window did.
  - Name: the window was not measured and two other checks failed
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: { String: "Unknown" }
      device.IsHeadless: false
      device.IsVisible: { String: "Unknown" }
      device.BrowserReleaseYear: 2019
      device.BrowserReleaseAge: 84
      ip.HumanProbability: 2
      ip.ConnectionType: Broadband
    Expect: { Value: Low }

  # False, none of the other three failed. Medium, because the window
  # was measured and was not in view, which is one failed check.
  - Name: the window was measured and was not in view, nothing else failed
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: { String: "False" }
      device.IsHeadless: false
      device.IsVisible: { String: "False" }
      device.BrowserReleaseYear: 2026
      device.BrowserReleaseAge: 1
      ip.HumanProbability: 9
      ip.ConnectionType: Broadband
    Expect: { Value: Medium }

  # False, one of the other three failed. Low, being two failed checks.
  # This is the row that shows a measured window is treated differently
  # from an unmeasured one, because the same request with Unknown in
  # place of False is Medium.
  - Name: the window was measured and was not in view, one other check failed
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: { String: "False" }
      device.IsHeadless: false
      device.IsVisible: { String: "False" }
      device.BrowserReleaseYear: 2019
      device.BrowserReleaseAge: 84
      ip.HumanProbability: 9
      ip.ConnectionType: Broadband
    Expect: { Value: Low }

  # A web driver that has not been asked about does not force Low. Only
  # True is decisive, so Unknown leaves the request to the counted
  # checks. The window is in view here so that this case turns on the
  # web driver alone.
  - Name: an unasked web driver question does not force Low
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: { String: "Unknown" }
      device.IsHeadless: false
      device.IsVisible: { String: "True" }
      device.BrowserReleaseYear: 2026
      device.BrowserReleaseAge: 1
      ip.HumanProbability: 9
      ip.ConnectionType: Broadband
    Expect: { Value: High }

  # A value of device.IsVisible that the script does not know fails both
  # window checks, so it is read the same way as False and the answer is
  # Medium with nothing else failing. The data does not carry such a
  # value today and this case pins the safe direction for the day it
  # does.
  - Name: a window value the script does not know is read as not in view
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: { String: "False" }
      device.IsHeadless: false
      device.IsVisible: { String: "N/A" }
      device.BrowserReleaseYear: 2026
      device.BrowserReleaseAge: 1
      ip.HumanProbability: 9
      ip.ConnectionType: Broadband
    Expect: { Value: Medium }

  # Version 0.6.0. High needs a browser released in the last three
  # months. These four walk the boundary and prove that an older browser
  # only stops High, and does not on its own take a request any lower.
  - Name: a browser three months old still reaches High
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: { String: "False" }
      device.IsHeadless: false
      device.IsVisible: { String: "True" }
      device.BrowserReleaseYear: 2026
      device.BrowserReleaseAge: 3
      ip.HumanProbability: 9
      ip.ConnectionType: Broadband
    Expect: { Value: High }

  - Name: a browser four months old is capped at Medium
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: { String: "False" }
      device.IsHeadless: false
      device.IsVisible: { String: "True" }
      device.BrowserReleaseYear: 2026
      device.BrowserReleaseAge: 4
      ip.HumanProbability: 9
      ip.ConnectionType: Broadband
    Expect: { Value: Medium }

  # Eighteen months is old enough to be capped and young enough that
  # BrowserIsCurrent still passes, so nothing has failed and the answer
  # is Medium rather than Low.
  - Name: a browser eighteen months old is capped, not counted against
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: { String: "False" }
      device.IsHeadless: false
      device.IsVisible: { String: "True" }
      device.BrowserReleaseYear: 2025
      device.BrowserReleaseAge: 18
      ip.HumanProbability: 9
      ip.ConnectionType: Broadband
    Expect: { Value: Medium }

  # The cap and one real failure together are still Medium, because the
  # cap is not a failure and the Medium rule allows one.
  - Name: a browser eighteen months old on an unknown connection
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: { String: "False" }
      device.IsHeadless: false
      device.IsVisible: { String: "True" }
      device.BrowserReleaseYear: 2025
      device.BrowserReleaseAge: 18
      ip.HumanProbability: 9
      ip.ConnectionType: Unknown
    Expect: { Value: Medium }

  # An unmeasured window and a browser past three months, which is the
  # ordinary first request from a device that has not updated recently.
  - Name: an unmeasured window and a browser past three months
    Properties:
      device.IsCrawler: false
      device.HasWebDriver: { String: "Unknown" }
      device.IsHeadless: false
      device.IsVisible: { String: "Unknown" }
      device.BrowserReleaseYear: 2025
      device.BrowserReleaseAge: 18
      ip.HumanProbability: 9
      ip.ConnectionType: Broadband
    Expect: { Value: Medium }
