# Name is what configuration selects a script by, so it must be a plain
# identifier that a configuration file and a generated enumeration can both
# hold.
Script: |
  Format: 1
  Name: Broken Script
  Version: 1.0.0
  Output:
    Name: Broken
    Description: An output.
    ValueType: string
    IsList: false
  Rules:
    - Else: High
Expect:
  Paths: [ "Name" ]
  Mentions: [ "does not match the pattern" ]
