# A rule is either a When with a Then, or an Else on its own.
Script: |
  Format: 1
  Name: Broken
  Version: 1.0.0
  Output:
    Name: Broken
    Description: An output.
    ValueType: string
    IsList: false
  Rules:
    - When: { Property: device.IsCrawler, Eq: false }
      Else: Low
Expect:
  Paths: [ "Rules[0]" ]
  Mentions: [ "has both When and Else" ]
