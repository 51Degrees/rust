# The Optional list was removed from the format, because the engine must
# not be over engineered.
# A property is either present or it is not, so there is nothing for the
# list to say, and a script still carrying one is a fault rather than a
# block quietly ignored.
Script: |
  Format: 1
  Name: Broken
  Version: 1.0.0
  Output:
    Name: Broken
    Description: An output.
    ValueType: string
    IsList: false
  Optional:
    - device.IsCrawler
  Rules:
    - When: { Property: device.IsCrawler, Eq: false }
      Then: High
    - Else: Low
Expect:
  Paths: [ "Optional" ]
  Mentions: [ "unknown key 'Optional' at the top level" ]
