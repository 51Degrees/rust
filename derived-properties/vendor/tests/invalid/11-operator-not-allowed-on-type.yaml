# Gt is not allowed on a string, because collation differs between
# languages and the same script would then answer differently in each.
Script: |
  Format: 1
  Name: Broken
  Version: 1.0.0
  Output:
    Name: Broken
    Description: An output.
    ValueType: string
    IsList: false
  Rules:
    - When: { Property: device.BrowserName, Gt: "Chrome" }
      Then: High
    - Else: Low
Expect:
  Paths: [ "Rules[0].When" ]
  Mentions: [ "operator 'Gt' is not allowed on type string" ]
