# Rules are read in order and the first match wins, so an Else anywhere but
# last would make every rule after it unreachable.
Script: |
  Format: 1
  Name: Broken
  Version: 1.0.0
  Output:
    Name: Broken
    Description: An output.
    ValueType: string
    IsList: false
  Rules:
    - Else: Low
    - When: { Property: device.IsCrawler, Eq: false }
      Then: High
    - Else: Low
Expect:
  Paths: [ "Rules[0]" ]
  Mentions: [ "Else is only allowed on the last rule" ]
