# The file name without its extension must equal Name, so a reader can find
# the file a configuration names without opening every file. Name below is
# the file name the case is run under.
Name: Expected
Script: |
  Format: 1
  Name: Different
  Version: 1.0.0
  Output:
    Name: Different
    Description: An output.
    ValueType: string
    IsList: false
  Rules:
    - Else: High
Expect:
  Paths: [ "Name" ]
  Mentions: [ "must equal the file name 'Expected'" ]
