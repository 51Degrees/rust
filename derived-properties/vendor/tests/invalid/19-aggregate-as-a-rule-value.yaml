# Then and Else are literals of the output value type. An aggregate object
# standing as a rule value was removed from the format,
# because the only script that used it counted the checks that could be
# evaluated and every check is now always evaluated. The output below is an
# int, which is the one type that once accepted a count, so this case
# proves the rule is gone rather than only narrowed.
Script: |
  Format: 1
  Name: Broken
  Version: 1.0.0
  Output:
    Name: Broken
    Description: An output.
    ValueType: int
    IsList: false
  Checks:
    NotCrawler: { Property: device.IsCrawler, Eq: false }
  Rules:
    - When: { Check: NotCrawler }
      Then: { Failed: Checks }
    - Else: 0
Expect:
  Paths: [ "Rules[0].Then" ]
  Mentions: [ "a rule value is a literal of the output value type" ]
