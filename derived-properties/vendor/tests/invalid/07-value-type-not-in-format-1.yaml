# The weighted types, javascript, ip, wkb and the rest are real 51Degrees
# value types, but format 1 handles only the four scalars.
Script: |
  Format: 1
  Name: Broken
  Version: 1.0.0
  Output:
    Name: Broken
    Description: An output.
    ValueType: weightedstring
    IsList: false
  Rules:
    - Else: High
Expect:
  Paths: [ "Output.ValueType" ]
  Mentions: [ "is not allowed in format 1" ]
