# A Check reference names a check defined in the same script.
Script: |
  Format: 1
  Name: Broken
  Version: 1.0.0
  Output:
    Name: Broken
    Description: An output.
    ValueType: string
    IsList: false
  Checks:
    NotCrawler: { Property: device.IsCrawler, Eq: false }
  Rules:
    - When: { Check: NotACrawler }
      Then: High
    - Else: Low
Expect:
  Paths: [ "Rules[0].When.Check" ]
  Mentions: [ "check 'NotACrawler' is not defined" ]
