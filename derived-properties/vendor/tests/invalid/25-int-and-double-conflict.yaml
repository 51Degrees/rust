# A number infers its type from its value rather than from the way the
# value was written, so 2 and 2.0 both infer int and only a value with a
# fractional part infers double. This case pins the rule by comparing one
# property against a whole number in one place and against 2.5 in another,
# which is a real conflict every language must report.
#
# The companion positive case, being that 2 and 2.0 do NOT conflict, is
# covered by the unit tests in each language rather than here, because a
# script that validates cannot be a rejection case.
Script: |
  Format: 1
  Name: Broken
  Version: 1.0.0
  Output:
    Name: Broken
    Description: An output.
    ValueType: string
    IsList: false
  Checks:
    AsWholeNumber: { Property: device.BrowserReleaseAge, Lt: 2.0 }
  Rules:
    - When: { Property: device.BrowserReleaseAge, Lt: 2.5 }
      Then: High
    - Else: Low
Expect:
  Paths: [ "Rules[0].When" ]
  Mentions: [ "already inferred as int at Checks.AsWholeNumber" ]
