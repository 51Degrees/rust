# A group is the word Checks, meaning every check, or a list of check
# names, and every name in that list must exist.
Script: |
  Format: 1
  Name: Broken
  Version: 1.0.0
  Output:
    Name: Broken
    Description: An output.
    ValueType: string
    IsList: false
  Checks:
    NotCrawler: { Property: device.IsCrawler, Eq: false }
  Rules:
    - When: { Passed: [NotCrawler, Visible], Ge: 1 }
      Then: High
    - Else: Low
Expect:
  Paths: [ "Rules[0].When.Passed" ]
  Mentions: [ "check 'Visible' is not defined" ]
