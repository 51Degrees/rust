# A property's type comes from the literals it is compared against, so two
# literals of different types leave no way to read the value. The message
# names both places.
Script: |
  Format: 1
  Name: Broken
  Version: 1.0.0
  Output:
    Name: Broken
    Description: An output.
    ValueType: string
    IsList: false
  Checks:
    AsBool: { Property: device.IsCrawler, Eq: false }
  Rules:
    - When: { Property: device.IsCrawler, Eq: 1 }
      Then: High
    - Else: Low
Expect:
  Paths: [ "Rules[0].When" ]
  Mentions: [ "already inferred as bool at Checks.AsBool" ]
