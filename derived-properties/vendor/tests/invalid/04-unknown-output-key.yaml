# A typo in a metadata field is caught rather than silently dropped, which
# is why unknown keys under Output are faults.
Script: |
  Format: 1
  Name: Broken
  Version: 1.0.0
  Output:
    Name: Broken
    Description: An output.
    ValueType: string
    IsList: false
    IsPopluar: true
  Rules:
    - Else: High
Expect:
  Paths: [ "Output.IsPopluar" ]
  Mentions: [ "unknown key 'IsPopluar' under Output" ]
