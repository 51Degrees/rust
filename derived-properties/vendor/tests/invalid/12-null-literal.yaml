# A null literal has no type and no meaning in a comparison. Absence is
# not written in a script at all, because a property that is absent leaves
# the whole derived property with no value before any rule runs.
Script: |
  Format: 1
  Name: Broken
  Version: 1.0.0
  Output:
    Name: Broken
    Description: An output.
    ValueType: string
    IsList: false
  Rules:
    - When: { Property: device.IsCrawler, Eq: null }
      Then: High
    - Else: Low
Expect:
  Paths: [ "Rules[0].When.Eq" ]
  Mentions: [ "a null literal is not allowed" ]
