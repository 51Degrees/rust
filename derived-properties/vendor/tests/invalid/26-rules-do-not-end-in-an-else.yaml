# Every script ends in an Else, so once its source properties have been
# read a script always chooses a value. A Rules list whose last entry is a
# When would leave a request that matched nothing with no answer, and the
# format has no runtime path for that any more.
Script: |
  Format: 1
  Name: Broken
  Version: 1.0.0
  Output:
    Name: Broken
    Description: An output.
    ValueType: string
    IsList: false
  Rules:
    - When: { Property: device.IsCrawler, Eq: false }
      Then: High
Expect:
  Paths: [ "Rules" ]
  Mentions: [ "the last rule must be an Else" ]
