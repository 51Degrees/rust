# DefaultValue is metadata carried through to the property definition and
# nothing reads it while a request is being processed, because every script
# ends in an Else. It still has to be one of the values the property says
# it can return, so that the metadata does not contradict itself.
Script: |
  Format: 1
  Name: Broken
  Version: 1.0.0
  Output:
    Name: Broken
    Description: An output.
    ValueType: string
    IsList: false
    DefaultValue: Nothing
    Values:
      - { Name: High, Description: High. }
      - { Name: Low, Description: Low. }
  Rules:
    - When: { Property: device.IsCrawler, Eq: false }
      Then: High
    - Else: Low
Expect:
  Paths: [ "Output.DefaultValue" ]
  Mentions: [ "'Nothing' is not one of the values listed under Output.Values" ]
