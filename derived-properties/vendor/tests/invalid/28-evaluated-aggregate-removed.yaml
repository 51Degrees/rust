# The Evaluated aggregate was removed from the format.
# The rules only run once every source property named by the script has
# been read, so every check is always evaluated and the count would be the
# number of checks on every request. Passed and Failed remain.
Script: |
  Format: 1
  Name: Broken
  Version: 1.0.0
  Output:
    Name: Broken
    Description: An output.
    ValueType: string
    IsList: false
  Checks:
    NotCrawler: { Property: device.IsCrawler, Eq: false }
  Rules:
    - When: { Evaluated: Checks, Eq: 0 }
      Then: High
    - Else: Low
Expect:
  Paths: [ "Rules[0].When" ]
  Mentions: [ "Found the keys Evaluated, Eq" ]
