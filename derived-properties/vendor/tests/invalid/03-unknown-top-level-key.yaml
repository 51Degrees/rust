# The inputs block was removed from the design, so a
# script still carrying one is a fault rather than a block quietly ignored.
Script: |
  Format: 1
  Name: Broken
  Version: 1.0.0
  Inputs:
    - device.IsCrawler
  Output:
    Name: Broken
    Description: An output.
    ValueType: string
    IsList: false
  Rules:
    - Else: High
Expect:
  Paths: [ "Inputs" ]
  Mentions: [ "unknown key 'Inputs' at the top level" ]
