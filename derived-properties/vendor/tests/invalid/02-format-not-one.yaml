# Format names the version of the script language, and 1 is the only value
# format 1 defines.
Script: |
  Format: 2
  Name: Broken
  Version: 1.0.0
  Output:
    Name: Broken
    Description: An output.
    ValueType: string
    IsList: false
  Rules:
    - Else: High
Expect:
  Paths: [ "Format" ]
  Mentions: [ "Format must be 1, found 2" ]
