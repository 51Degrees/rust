# The Present operator was removed from the format
# along with the unknown third state. Whether a property is there is
# settled before any rule runs, and where one is absent the whole derived
# property has no value, so a script has nothing to ask and no answer to
# act on.
Script: |
  Format: 1
  Name: Broken
  Version: 1.0.0
  Output:
    Name: Broken
    Description: An output.
    ValueType: string
    IsList: false
  Rules:
    - When: { Property: device.IsVisible, Present: true }
      Then: High
    - Else: Low
Expect:
  Paths: [ "Rules[0].When" ]
  Mentions: [ "unknown operator 'Present'" ]
