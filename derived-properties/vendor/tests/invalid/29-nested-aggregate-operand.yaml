# A count is compared with a whole number and never with another count.
# Comparing one count against another was allowed by the reference
# implementation once and was removed with the rest of
# the format's second layer, because no script needs it and the format is
# not a programming language.
Script: |
  Format: 1
  Name: Broken
  Version: 1.0.0
  Output:
    Name: Broken
    Description: An output.
    ValueType: string
    IsList: false
  Checks:
    NotCrawler: { Property: device.IsCrawler, Eq: false }
    Human:      { Property: ip.HumanProbability, Ge: 8 }
  Rules:
    - When: { Failed: Checks, Gt: { Passed: Checks } }
      Then: High
    - Else: Low
Expect:
  Paths: [ "Rules[0].When.Gt" ]
  Mentions: [ "an aggregate is compared with a whole number" ]
