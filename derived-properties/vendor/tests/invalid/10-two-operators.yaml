# A condition takes one Property and exactly one operator. Two operators
# read as an And that was never written.
Script: |
  Format: 1
  Name: Broken
  Version: 1.0.0
  Output:
    Name: Broken
    Description: An output.
    ValueType: string
    IsList: false
  Checks:
    Range: { Property: device.BrowserReleaseYear, Gt: 2000, Lt: 2100 }
  Rules:
    - When: { Check: Range }
      Then: High
    - Else: Low
Expect:
  Paths: [ "Checks.Range" ]
  Mentions: [ "exactly one operator" ]
