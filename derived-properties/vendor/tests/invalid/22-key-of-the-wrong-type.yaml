# IsList is a boolean. YAML reads a bare word as a string, which is one of
# the reasons the format asks authors to write true and false and to quote
# their strings.
Script: |
  Format: 1
  Name: Broken
  Version: 1.0.0
  Output:
    Name: Broken
    Description: An output.
    ValueType: string
    IsList: nope
  Rules:
    - Else: High
Expect:
  Paths: [ "Output.IsList" ]
  Mentions: [ "expected a boolean" ]
