# A source property names the element it comes from, because the same
# property name can exist on more than one element in a pipeline.
Script: |
  Format: 1
  Name: Broken
  Version: 1.0.0
  Output:
    Name: Broken
    Description: An output.
    ValueType: string
    IsList: false
  Rules:
    - When: { Property: IsCrawler, Eq: false }
      Then: High
    - Else: Low
Expect:
  Paths: [ "Rules[0].When.Property" ]
  Mentions: [ "elementKey.PropertyName" ]
