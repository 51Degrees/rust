# Where Output.Values lists the values the property can return, every Then
# and Else must name one of them, so the metadata and the rules cannot
# drift apart.
Script: |
  Format: 1
  Name: Broken
  Version: 1.0.0
  Output:
    Name: Broken
    Description: An output.
    ValueType: string
    IsList: false
    Values:
      - { Name: High, Description: High. }
      - { Name: Low, Description: Low. }
  Rules:
    - When: { Property: device.IsCrawler, Eq: false }
      Then: Enormous
    - Else: Low
Expect:
  Paths: [ "Rules[0].Then" ]
  Mentions: [ "'Enormous' is not one of the values listed under Output.Values" ]
