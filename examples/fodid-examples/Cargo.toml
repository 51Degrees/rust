[package]
publish = false  # internal example/bench crate, not for crates.io
name = "fodid-examples"
version = "4.5.2"
description = "Runnable 51Did examples for the 51Degrees Rust SDK: the creator context web demo with two-step verification."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# Shared example helpers: the resource-key and cloud-endpoint resolvers, so this
# demo reads the same environment variables as every other cloud example.
examples-shared = { version = "4.5.2", path = "../examples-shared" }
# The vendored design-system stylesheet and the handler that serves it. One copy
# lives in that crate and is shared by every web example, so the weekly asset
# refresh updates this demo's stylesheet along with the others.
examples-web-shared = { version = "4.5.2", path = "../examples-web-shared" }

# The 51Did reader, from crates.io as every example's 51Degrees crates are,
# and from this tree under `cargo --config source.toml`. Never by path, which
# would win over the registry and leave the published crate untested.
fodid = "4.5.8"
# The client moved out of fodid into its own crate, so the example takes
# both: the reader for the identifier and the client for the two-step
# verification and the redeem.
# The reqwest-client feature compiles the client's own transport, which the
# demo sends through; the tests inject a transport of their own.
fodid-client = { version = "4.5.8", features = ["reqwest-client"] }

# The pipeline behind the demo's second route, where the browser calls this
# server and this server calls the service. The cloud request engine makes the
# call, the identifier engine turns the answer into a 51Did, and the web crates
# mount the client script and its callback here. reqwest-client compiles the
# engine's built-in transport, which the running demo sends through.
fiftyone-cloud-request-engine = { version = "4.5.2", features = ["reqwest-client"] }
fiftyone-fodid-cloud = "4.5.3"
fiftyone-pipeline-core = "4.5.2"
fiftyone-pipeline-web = "4.5.2"
fiftyone-pipeline-web-axum = "4.5.2"
# ShareUsageElement, which every web example adds because it lets 51Degrees
# improve detection. share-usage-transport compiles the built-in sender, off by
# default so the crate stays wasm-buildable.
fiftyone-pipeline-engines-fiftyone = { version = "4.5.2", features = ["share-usage-transport"] }

# axum 0.8 matches the version the other web examples use, so no second major
# version is pulled into the graph.
axum.workspace = true
# The demo needs a real async runtime, the #[tokio::main] and #[tokio::test]
# macros, and the TCP listener it serves on (net).
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }

# Random source for the per-load challenge. The standard library has none.
getrandom = "0.3"

# Query-string parsing for the redeem route and the JSON bodies it answers
# the page with.
serde.workspace = true
serde_json = "1"
# Ergonomic error handling for the example `run` function and `main`.
anyhow = "1"

[dev-dependencies]
# The `util` feature provides `ServiceExt::oneshot`, used by the test to drive
# the router in process without binding a socket.
tower = { workspace = true, features = ["util"] }
# The OWID creator types the identifier crate re-exports behind its creator
# feature, to sign a 51Did in the tests the way the cloud would, so the redeem
# route is driven with a genuine identifier.
fodid = { version = "4.5.8", features = ["creator"] }

