[package]
publish = false  # internal example/bench crate, not for crates.io
name = "fodid-examples"
version = "4.5.2"
description = "Runnable 51Did examples for the 51Degrees Rust SDK: the creator context web demo with two-step verification."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# Shared example helpers: the resource-key and cloud-endpoint resolvers, so this
# demo reads the same environment variables as every other cloud example.
examples-shared = { version = "4.5.2", path = "../examples-shared" }
# The vendored design-system stylesheet and the handler that serves it. One copy
# lives in that crate and is shared by every web example, so the weekly asset
# refresh updates this demo's stylesheet along with the others.
examples-web-shared = { version = "4.5.2", path = "../examples-web-shared" }

# axum 0.8 matches the version the other web examples use, so no second major
# version is pulled into the graph.
axum.workspace = true
# The demo needs a real async runtime, the #[tokio::main] and #[tokio::test]
# macros, and the TCP listener it serves on (net).
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }

# Async HTTP client for the server-side redeem call to the cloud. Default
# features are off and rustls is on, exactly as the cloud request engine
# configures its own reqwest, so one TLS stack serves the whole examples graph
# and no system OpenSSL is needed on Windows. The query feature builds the
# redeem call's query string, encoding the base64 result on the way.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "query"] }
# Random source for the per-load challenge. The standard library has none.
getrandom = "0.3"

# Query-string parsing for the redeem route and the JSON error body it returns
# when the cloud cannot be reached.
serde.workspace = true
serde_json = "1"
# Ergonomic error handling for the example `run` function and `main`.
anyhow = "1"

[dev-dependencies]
# The `util` feature provides `ServiceExt::oneshot`, used by the test to drive
# the router in process without binding a socket.
tower = { workspace = true, features = ["util"] }
